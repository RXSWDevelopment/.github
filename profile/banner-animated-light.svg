.sg{fill:none;stroke:#0B0B0C;stroke-width:5}
@media (prefers-reduced-motion:no-preference){
  .tr{animation:draw 10s ease-in-out infinite}
  .sg{animation:sig 10s ease-in-out infinite}
}
@keyframes draw{
  0%{stroke-dashoffset:100;stroke:#BDBDC2;opacity:1}
  28%{stroke-dashoffset:0;stroke:#BDBDC2;opacity:1}
  44%{stroke-dashoffset:0;stroke:#E8E8EA;opacity:1}
  92%{stroke-dashoffset:0;stroke:#E8E8EA;opacity:1}
  100%{stroke-dashoffset:0;stroke:#E8E8EA;opacity:0}
}
@keyframes sig{
  0%,27%{opacity:0}
  31%{opacity:1}
  62%{opacity:1}
  70%{opacity:.45}
  78%{opacity:1}
  92%{opacity:1}
  100%{opacity:0}
}</style>
