<title id="t">RXSW — Signal from the noise.</title>
<desc id="d">RXSW logo. In the background a noisy trace draws itself and settles into a straight line: signal from the noise.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" x="-1" y="-1"><path d="M40 0H0V40" fill="none" stroke="#E6E6E4"/></pattern></defs>
<style>
